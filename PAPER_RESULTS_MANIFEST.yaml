artifact_version: "1.1"
paper_title: "T-BGMP: An Empirical Characterization of Key-Layer Protection for KV-Cache Quantization Failure Recovery"

paper_items:
  table_1: results/paper_tables/table_control_statistics.csv
  table_2: results/paper_tables/table_first_success_k.csv
  figure_2: results/paper_tables/figure_2_domain_recovery.csv
  table_3: results/paper_tables/table_risk_ablation.csv
  table_4: results/paper_tables/table_weight_sensitivity.csv
  table_5: results/paper_tables/table_domain_heldout.csv
  table_6: results/paper_tables/table_frozen_top3.csv
  table_7: results/paper_tables/table_ruler_transfer.csv

paper_text_items:
  fixed_layer_check:
    cases: results/extensions/fixed_layer/case_level.csv
    provenance: results/extensions/fixed_layer/source_provenance.json
    audit_command: python scripts/audit_extension_results.py
  cross_seed_heldout:
    cases: results/extensions/cross_seed_heldout/case_level.csv
    rankings: results/extensions/cross_seed_heldout/rankings.csv
    provenance: results/extensions/cross_seed_heldout/source_provenance.json
    audit_command: python scripts/audit_extension_results.py
  additional_models:
    summary: results/paper_tables/table_supporting_models.csv
    included_rows:
      - Mistral-7B-Instruct-v0.3
      - Yi-1.5-9B-Chat-16K
      - Zephyr-7B-Beta
      - SmolLM2-1.7B-Instruct
    audit_command: python scripts/audit_results.py
  gemma2_incomplete_key_only_recovery:
    cases: results/extensions/gemma2_boundary/case_level.csv
    summary: results/extensions/gemma2_boundary/summary.csv
    provenance: results/extensions/gemma2_boundary/source_provenance.json
    audit_command: python scripts/audit_extension_results.py

extension_case_level:
  weight_sensitivity:
    rankings: results/extensions/weight_sensitivity/rankings.csv
    cases: results/extensions/weight_sensitivity/case_level.csv
  fixed_layer: results/extensions/fixed_layer/case_level.csv
  cross_seed_heldout:
    rankings: results/extensions/cross_seed_heldout/rankings.csv
    cases: results/extensions/cross_seed_heldout/case_level.csv
  domain_heldout: results/extensions/domain_heldout/case_level.csv
  frozen_top3: results/extensions/frozen_top3/case_level.csv
  ruler_screening: results/extensions/ruler/screening_case_level.csv
  ruler_recovery: results/extensions/ruler/recovery_case_level.csv
  gemma2_boundary:
    cases: results/extensions/gemma2_boundary/case_level.csv
    summary: results/extensions/gemma2_boundary/summary.csv
  provenance: results/extensions/source_provenance.json
  audit_command: python scripts/audit_extension_results.py

main_evidence:
  aggregate:
    sensitive_cases: 183
    restored: 183
    source: results/paper_tables/table_main_evidence.csv
    audit_command: python scripts/audit_results.py
  models:
    qwen3_4b:
      sensitive_cases: 72
      restored: 72
      role: main
    qwen25_3b:
      sensitive_cases: 72
      restored: 72
      role: main
    qwen25_14b:
      sensitive_cases: 14
      restored: 14
      role: main
    llama32_3b:
      sensitive_cases: 25
      restored: 25
      role: main

supporting:
  mistral_7b:
    role: supporting
  yi_15_9b:
    role: supporting
  zephyr_7b:
    role: supporting
  smollm2_17b:
    role: supporting
  gemma2_9b:
    role: boundary_supporting
    note: "incomplete key-only recovery boundary; final artifact is under results/extensions/gemma2_boundary"

excluded:
  gemma3_4b:
    reason: FP16-invalid
  qwen35_4b:
    reason: cache-interface-limited
  internlm25_7b:
    reason: compatibility-limited
  glm4_9b:
    reason: generation-interface-limited

smoke_test:
  status: validated
  model: Qwen2.5-3B-Instruct
  backend: patched TurboQuant
  policies:
    - fp16
    - tbgmp_topk
  sanitized_examples: examples/smoke_test

not_included:
  - model weights
  - raw HPC logs
  - full raw model responses
  - production quantizer kernel
  - private machine paths
