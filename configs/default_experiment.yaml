experiment:
  mode: diagnostic_failure_recovery
  domains: [math, literature, science, code]
  context_lengths: [4096, 6144, 8192]
  needle_depths: [10, 50, 90]
  seeds: [0, 1]
  residual_window: 128
  maximum_topk: 12
  max_new_tokens: 32
  default_seed: 0
  random_seeds: [0, 1, 2]
  discovery_policies:
    - fp16
    - uniform_k2_v2_rw128
    - uniform_k4_v2_rw128
    - uniform_k6_v2_rw128
    - uniform_k6_v4_rw128
  aggressive_policies: [uniform_k4_v2_rw128, uniform_k2_v2_rw128]
  safe_policies: [uniform_k6_v2_rw128, uniform_k6_v4_rw128]
  tbgmp_policy: tbgmp_topk

inputs:
  model_registry: configs/model_registry.yaml
  policies: configs/policies.yaml
  prompt_template: configs/prompt_template.yaml
  cases: /path/to/cases.csv
  risk_ranking: /path/to/risk_ranking.csv

outputs:
  results: /path/to/outputs/full_pipeline_results.csv
  generated_cases: /path/to/outputs/generated_cases.csv
  checkpoint_every: 25

case_generation:
  protocol: formal_hpc_v1
  domain_sources:
    math: data/formal_contexts/math.txt
    literature: data/formal_contexts/literature.txt
    science: data/formal_contexts/science.txt
    code: data/formal_contexts/code.txt
  answers_by_seed:
    0: AURORA-7749
    1: NEBULA-3186
  question: "What is the secret project code name? Answer with just the code name."
  reserve_tokens: 96

profiling:
  domain: literature
  context_length: 4096
  quant_bits: 2
  max_rows: 20000
  ip_pairs: 8192
  seed: 42
  device: cuda
  load_in_4bit: false

backend:
  config: configs/backend_turboquant.yaml

selection:
  require_fp16_found: true
  require_aggressive_found: false
  exclude_execution_errors: true
