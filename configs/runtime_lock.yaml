schema_version: 1

# These profiles record environments used by completed T-BGMP GPU runs. They
# are intentionally separate because the two clusters did not use one
# byte-identical Python environment.
profiles:
  xec_gpu:
    python: "3.10.20"
    cuda_runtime: "12.1"
    requirements: requirements-gpu-xec.txt
    packages:
      torch: "2.5.1+cu121"
      transformers: "5.12.1"
      accelerate: "1.14.0"
      safetensors: "0.8.0"
      numpy: "2.2.6"
      PyYAML: "6.0.3"
      triton: "3.1.0"
  sip_gpu:
    python: "3.12.12"
    cuda_runtime: site-provided
    requirements: requirements-gpu-sip.txt
    packages:
      torch: "2.5.1"
      transformers: "5.12.1"
      accelerate: "1.14.0"
      safetensors: "0.7.0"
      numpy: "2.3.3"
      PyYAML: "6.0.3"
      triton: "3.1.0"

external_runtime:
  turboquant:
    repository: https://github.com/tonbistudio/turboquant-pytorch.git
    upstream_commit: 999713889a18c0ffa20c62a65e7cbbe5746794e3

