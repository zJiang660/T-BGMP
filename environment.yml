# CPU-only artifact analysis environment. For model inference use one of the
# recorded GPU profiles in environment-gpu-xec.yml or environment-gpu-sip.yml.
name: tbgmp-artifact-cpu
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy
  - pandas
  - matplotlib
  - scipy
  - pyyaml
  - pytest
  - pip
